name: code-quality-gate
version: 1.1.0
description: |
  Server-side AI gatekeeper for pull requests with multi-provider AI support.
  Automatically scans every PR for security vulnerabilities, repository impact, 
  and platform-specific best practices across AEM, modern frontend (React/TS), 
  and Magento/PHP codebases.
  
  Supports GitHub Copilot, Anthropic Claude, OpenAI ChatGPT, Azure OpenAI, and 
  custom OpenAI-compatible providers. Blocks the merge button when violations 
  are found, posts detailed remediation guidance, and sends notifications via 
  Slack and email.

author:
  name: Bhavesh Singh
  email: bhavesh.singh@example.com
  github: bhaveshsingh07

homepage: https://github.com/dept/dtin-commit-agent
repository: https://github.com/dept/dtin-commit-agent

license: UNLICENSED

tags:
  - ci-cd
  - security
  - code-quality
  - pr-gatekeeper
  - github-actions

runtime_requirements:
  node: ">=20"
  runner: self-hosted or github-hosted
  required_secrets:
    - AI_API_KEY (or provider-specific: COPILOT_PAT, ANTHROPIC_API_KEY, OPENAI_API_KEY)
  optional_secrets:
    - AI_PROVIDER (copilot, claude, openai, azure, custom)
    - AI_MODEL (model name for the chosen provider)
    - AI_BASE_URL (for azure or custom endpoints)
    - SLACK_WEBHOOK_URL
    - EMAIL_SMTP_HOST
    - EMAIL_SMTP_USER
    - EMAIL_SMTP_PASS
    - EMAIL_RECIPIENTS

supported_platforms:
  - aem
  - react
  - typescript
  - magento
  - php

installation:
  type: custom
  instructions: |
    This module requires both BMad-level and GitHub-level setup:
    
    1. Add to your project: npx bmad-method install --module code-quality-gate
    2. Deploy central repo: Push this code to dept/dtin-commit-agent
    3. Add secrets: COPILOT_PAT at org or repo level
    4. Install runner: For self-hosted, see SETUP.md
    5. Add to repos: Copy .github/workflows/code-guardian.yml to consumer repos

config_options:
  ai_provider:
    type: string
    default: copilot
    allowed: [copilot, claude, openai, azure, custom]
    description: Which AI service to use for code analysis
  
  ai_model:
    type: string
    default: (provider-specific default)
    examples:
      - claude-sonnet-4-20250514
      - claude-opus-4-20250514
      - claude-haiku-4-20241022
      - gpt-4o
      - gpt-4-turbo
      - gpt-3.5-turbo
    description: Specific model to use (provider-dependent)
  
  slack_enabled:
    type: boolean
    default: false
    description: Send failure notifications to Slack
  
  email_enabled:
    type: boolean
    default: false
    description: Send failure notifications via email
  
  concurrency:
    type: integer
    default: 4
    description: Number of chunks to analyze in parallel
